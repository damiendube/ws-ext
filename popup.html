<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wealthsimple ROI Analyzer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    
    <div class="content">
      <div class="form-row">
        <div class="form-group">
          <label for="accountSelect">Select Account:</label>
          <select id="accountSelect" class="select-input">
            <option value="">Loading accounts...</option>
          </select>
        </div>
        <button id="fetchData" class="btn btn-primary btn-small">Fetch</button>
      </div>
      
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Loading data...</p>
      </div>
      
      <div id="charts" class="charts hidden">
        <section class="card">
          <div class="card-head">
            <div>
              <h2>Return on investment</h2>
              <div class="type-row">
                <select id="returnType" class="return-type" aria-label="Return type">
                  <option value="cumulative">All-time return</option>
                  <option value="monthly">Monthly average</option>
                </select>
                <p id="roiRangeLabel" class="range-caption">All time</p>
              </div>
            </div>
            <span id="roiLatest" class="stat"></span>
          </div>
          <div class="plot plot-roi"><canvas id="roiChart"></canvas></div>
          <div class="ranges" id="roiRanges">
            <button type="button" class="range-btn" data-range="1D">1D</button>
            <button type="button" class="range-btn" data-range="1W">1W</button>
            <button type="button" class="range-btn" data-range="1M">1M</button>
            <button type="button" class="range-btn" data-range="3M">3M</button>
            <button type="button" class="range-btn" data-range="6M">6M</button>
            <button type="button" class="range-btn" data-range="YTD">YTD</button>
            <button type="button" class="range-btn" data-range="1Y">1Y</button>
            <button type="button" class="range-btn active" data-range="ALL">ALL</button>
          </div>
        </section>
        <div class="split-row">
          <section class="card card-asset">
            <h2>Allocation</h2>
            <div class="plot plot-asset"><canvas id="assetChart"></canvas></div>
            <p id="allocationNote" class="chart-note"></p>
          </section>
          <section class="card card-country">
            <h2>Countries</h2>
            <div class="plot plot-country"><canvas id="countryChart"></canvas></div>
            <p id="countryNote" class="chart-note"></p>
          </section>
        </div>
      </div>
      
      <div id="error" class="error hidden"></div>
    </div>
    <footer class="credits">
      <a href="https://icons8.com" target="_blank" rel="noopener noreferrer">Graph icon by Icons8</a>
    </footer>
  </div>
  
  <script src="chart.js"></script>
  <script src="popup.js"></script>
</body>
</html>
